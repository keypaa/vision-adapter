[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-adapter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch", "pyarrow", "pillow", "accelerate", "sentencepiece", "hf_transfer"]

[project.optional-dependencies]
train = ["transformers", "safetensors", "accelerate", "sentencepiece", "huggingface_hub", "datasets", "hf_transfer"]

[project.scripts]
vision-adapter = "vision_adapter.cli:main"

# scripts/ and tests/ are also packages (they have __init__.py), which makes
# setuptools' flat-layout auto-discovery bail with "Multiple top-level
# packages discovered". Name the one we ship explicitly.
[tool.setuptools.packages.find]
include = ["vision_adapter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15
